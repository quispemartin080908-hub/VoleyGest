<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoleyGest - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/EstiloLogin.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="imagen/x-icon" href="imagen/Logo.png">
</head>
<body style="background-image: url('imagen/Fondo.png');">
    <DIV class="wrapper">
     <!-- Puedes cambiar el action por la página que quieras mostrar después de enviar -->
     <form action="index.html">
        <img src="imagen/Logo.png" class="Logo">
        
        <!--TITULO RECUPERAR-->
        <h1>RECUPERAR</h1>
        
        <!-- TEXTO INFORMATIVO -->
        <p style="text-align: center; color: #fff; margin-bottom: 20px; font-size: 0.95em;">
            Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
        </p>
        
        <!--CONTENEDOR DE CORREO ELECTRÓNICO-->
        <div class="input-box">
        <input type="email" id="correo" placeholder="Correo Electrónico" required>
        <i class='bx bxs-envelope'></i>
        </div>
        
        <!--BOTÓN DE ENVIAR-->
        <button type="submit" class="btn">Enviar Enlace</button>
        
        <!--ENLACE PARA VOLVER AL LOGIN-->
        <div class="register-link">
        <p>¿Te acordaste? <a href="index.html">Iniciar Sesión</a></p>
        </div>
     </form>
    </DIV>


<!-- 1. Librería oficial de Supabase desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Archivo de configuración (ubicado en public/api/) -->
    <script src="public/api/config.js"></script>
    
    <!-- 3. Lógica del CRUD (ubicado en js/) -->
    <script src="js/api.js"></script>
    
    <!-- 4. Control general de la interfaz (ubicado en js/) -->
    <script src="js/main.js"></script>




</body>
</html>
