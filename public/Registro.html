<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoleyGest - Registro</title>
    <link rel="stylesheet" href="css/EstiloLogin.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="imagen/x-icon" href="imagen/Logo.png">
</head>
<body style="background-image: url('imagen/Fondo.png'); background-repeat: no-repeat;">
    <DIV class="wrapper">
     <form action="">
        <img src="imagen/Logo.png" class="Logo">
        <!--TITULO REGISTRARSE-->
        <h1>REGISTRARSE</h1>
        
        <!--CONTENEDOR DE USUARIO-->
        <div class="input-box">
        <input type="text" id="usuario" placeholder="Usuario" required>
        <i class='bx bxs-user'></i>
        </div>
        
        <!--CONTENEDOR DE CORREO ELECTRÓNICO-->
        <div class="input-box">
        <input type="email" id="correo" placeholder="Correo Electrónico" required>
        <i class='bx bxs-envelope'></i>
        </div>
        
        <!--CONTENEDOR DE CONTRASEÑA-->
        <div class="input-box">
        <input type="password" id="contraseña" placeholder="Contraseña" required>
        <i class='bx bxs-lock-alt'></i>
        </div>
        
        <!--CONTENEDOR DE CONFIRMAR CONTRASEÑA-->
        <div class="input-box">
        <input type="password" id="confirmar-contraseña" placeholder="Confirmar Contraseña" required>
        <i class='bx bxs-lock-alt'></i>
        </div>
        
        <!--CHECKBOX DE TÉRMINOS Y CONDICIONES-->
        <div class="remember-forgot">
            <label>
                <input type="checkbox" required> Acepto los<br>términos y condiciones
            </label>
        </div>
        
        <!--BOTÓN DE REGISTRO-->
        <button type="submit" class="btn">Registrarse</button>
        
        <!--ENLACE PARA VOLVER AL LOGIN-->
        <div class="register-link">
        <p>¿Ya tienes una cuenta? <a href="index.html">Iniciar Sesión</a></p>
        </div>
     </form>
    </DIV>



<!-- 1. Librería oficial de Supabase desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Archivo de configuración (ubicado en public/api/) -->
    <script src="public/api/config.js"></script>
    
    <!-- 3. Lógica del CRUD (ubicado en js/) -->
    <script src="js/api.js"></script>
    
    <!-- 4. Control general de la interfaz (ubicado en js/) -->
    <script src="js/main.js"></script>



</body>
</html>
